<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVShell</title>
<link rel="stylesheet" href="css/tvshell.css?v=7">
</head>
<body>
<div id="app">
  <div id="wallpaper"></div>
  <div id="scrim"></div>

  <header id="topbar">
    <div id="weather-zone" class="focusable" tabindex="-1">
      <div id="weather-icon"></div>
      <div id="weather-temp">--&deg;</div>
    </div>
    <div id="topbar-right">
      <div id="btn-bluetooth" class="topbtn focusable" tabindex="-1" title="Bluetooth">bt</div>
      <div id="btn-network" class="topbtn focusable" tabindex="-1" title="Network">net</div>
      <div id="btn-settings" class="topbtn focusable" tabindex="-1" title="Settings">gear</div>
      <div id="btn-power" class="topbtn focusable" tabindex="-1" title="Power">pwr</div>
      <div id="clock-zone">
        <div id="clock-time">--:--</div>
        <div id="clock-date">---</div>
      </div>
    </div>
  </header>

  <nav id="page-tabs"></nav>

  <main id="grid-wrap">
    <div id="tile-grid"></div>
  </main>

  <!-- overlays -->
  <div id="forecast-popup" class="panel hidden"></div>
  <div id="panel-host"></div>
  <div id="osk-host"></div>
  <div id="modal-host"></div>
  <div id="sleep-overlay" class="hidden"></div>
  <div id="toast"></div>
</div>
<script src="js/store.js?v=7"></script>
<script src="js/bridge.js?v=7"></script>
<script src="js/nav.js?v=7"></script>
<script src="js/osk.js?v=7"></script>
<script src="js/panels.js?v=7"></script>
<script src="js/weather.js?v=7"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
